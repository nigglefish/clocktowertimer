<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initital-scale=1.0"> 
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Blood on the Clocktower Timer">
    <title>
        Blood on the Clocktower
    </title>
    <style>
        @font-face {
            font-family: Blackletter;
            --src: url('blackletter.extrabold.ttf');
            src: url('OldLondon.ttf');
        }
        body {
            background-color: #000;
            height: 100%;
            overflow-y: hidden;
        }

        #clocktower {
            position: absolute;
            top: 0;
            left: calc((100vw - 100vh * 1620 / 2120) / 2);
            width: calc(100vh * 1620 / 2120);
            height: 100vh;
            background: url("face.png");
            background-size: cover;
            background-position: top;
            background-repeat: no-repeat;
            container-type: inline-size;
        }

        #clocktower #face {
            position: relative;
            top: 0;
            left: 0;
            width: 100%;
        }

        #clocktower #big {
            position: absolute;
            left: calc(100cqw * (810 - 50) / 1620);
            top: calc(100cqw * (810 - 450) / 1620);
            width: calc(100cqw * 100 / 1620);
            height: calc(100cqw * 450 / 1620);
            transform-origin: 50% 100%;
            transform: rotate(0deg);
        }
        #clocktower #small {
            position: absolute;
            left: calc(100cqw * (810 - 50) / 1620);
            top: calc(100cqw * (810 - 300) / 1620);
            width: calc(100cqw * 100 / 1620);
            height: calc(100cqw * 300 / 1620);
            transform-origin: 50% 100%;
            transform: rotate(0deg);
        }

        #players {
            position: absolute;
            top: 82cqh;
            left: 0;
            width: 100cqw;
            height: 16cqh;
        }


        #players .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-gap: 2%;
            position: absolute;
            left: 5%;
            bottom: 5%;
            width: 90%;
            height: 90%;
        }

        #players .grid .number {
            grid-row: 1;
            font-size: 10cqh;
            justify-self: center;
            align-self: start;
            font-family: Blackletter, serif;
            font-weight: bold;
        }
        #players .grid .label {
            grid-row: 1;
            font-size: 5cqh;
            justify-self: center;
            align-self: end;
            font-family: Blackletter, serif;
        }
        #players .grid .shadow {
            -webkit-text-stroke: 1cqw #000;
            paint-order: stroke fill;        
        }

        @media screen and (orientation: landscape) {
            #clocktower {
                left: calc((100vw - 130vh * 1620 / 2120) / 2);
                width: calc(130vh * 1620 / 2120);
                height: 100vh;
            }
        }

        .red {
            color: #F88;
        }
        .blue {
            color: #88F;
        }
    </style>
</head>
<body>
    <div id="clocktower">
        <img id="big" src="big.png">
        <img id="small" src="small.png">
        <div id="players">
            <div class="grid" id="grid-shadow">
                <div class="number blue shadow" id="townsfolk-count-shadow" style="grid-column:1">2</div>
                <div class="number blue shadow" id="outsider-count-shadow" style="grid-column:2">1</div>
                <div class="number red shadow" id="minion-count-shadow" style="grid-column:3">4</div>
                <div class="number red shadow" id="demon-count-shadow" style="grid-column:4">1</div>
    
                <div class="label blue shadow" id="townsfolk-label-shadow" style="grid-column:1">Townsfolk</div>
                <div class="label blue shadow" id="outsider-label-shadow" style="grid-column:2">Outsider</div>
                <div class="label red shadow" id="minion-label-shadow" style="grid-column:3">Minion</div>
                <div class="label red shadow" id="demon-label-shadow" style="grid-column:4">Demon</div>
            </div>
            <div class="grid" id="grid" style="display:hidden">
                <div class="number blue" id="townsfolk-count" style="grid-column:1">2</div>
                <div class="number blue" id="outsider-count" style="grid-column:2">1</div>
                <div class="number red" id="minion-count" style="grid-column:3">4</div>
                <div class="number red" id="demon-count" style="grid-column:4">1</div>
    
                <div class="label blue" id="townsfolk-label" style="grid-column:1">Townsfolk</div>
                <div class="label blue" id="outsider-label" style="grid-column:2">Outsider</div>
                <div class="label red" id="minion-label" style="grid-column:3">Minion</div>
                <div class="label red" id="demon-label" style="grid-column:4">Demon</div>
            </div>
        </div>
    </div>

    <script>
        let clocktower = document.getElementById('clocktower');
        let big = document.getElementById('big');
        let small = document.getElementById('small');
        let chime = new Audio('chime.mp3');
        let chimePlayed = false;
        let players = document.getElementById('players');
        let currentMinutes = 60;
        let intervalId = null;
        let currentPlayers = 5;

        const PLAYER_NUMBERS = [
            [3, 0, 1, 1],
            [3, 1, 1, 1],
            [5, 0, 1, 1],
            [5, 1, 1, 1],
            [5, 2, 1, 1],
            [7, 0, 2, 1],
            [7, 1, 2, 1],
            [7, 2, 2, 1],
            [9, 0, 3, 1],
            [9, 1, 3, 1],
            [9, 2, 3, 1],
        ];

        playerShadowData = [
            [document.getElementById('townsfolk-count-shadow'), document.getElementById('townsfolk-label-shadow'), 'Townsfolk'],
            [document.getElementById('outsider-count-shadow'), document.getElementById('outsider-label-shadow'), 'Outsider'],
            [document.getElementById('minion-count-shadow'), document.getElementById('minion-label-shadow'), 'Minion'],
            [document.getElementById('demon-count-shadow'), document.getElementById('demon-label-shadow'), 'Demon'],
        ];

        playerData = [
            [document.getElementById('townsfolk-count'), document.getElementById('townsfolk-label'), 'Townsfolk'],
            [document.getElementById('outsider-count'), document.getElementById('outsider-label'), 'Outsider'],
            [document.getElementById('minion-count'), document.getElementById('minion-label'), 'Minion'],
            [document.getElementById('demon-count'), document.getElementById('demon-label'), 'Demon'],
        ];

        function clickClockface(radians) {
            let minutes = Math.round(12.0 - 6.0 * radians / Math.PI);
            if (minutes == 0.0) {
                minutes = 12.0;
            }
            setTimer(minutes);
        }

        function updateClockface(minutes) {
            currentMinutes = minutes;
            big.style.transform = 'rotate(' + (-360.0 * minutes) + 'deg)';
            small.style.transform = 'rotate(' + (-30.0 * minutes) + 'deg)';
        }

        function setTimer(minutes) {
            let started = intervalId !== null;
            if(started) {
                stopTimer();
            }
            currentMinutes = minutes;
            updateClockface(minutes);
            if(started) {
                startTimer();
            }
        }

        function startTimer() {
            let startDate = new Date();
            let startMinutes = currentMinutes;
            updateClockface(startMinutes);
            clearInterval(intervalId);
            intervalId = setInterval(function() {
                let now = new Date();
                let elapsed = now - startDate;
                let minutes = startMinutes - elapsed / 60000;
                if(minutes < 0) {
                    minutes = 0;
                    stopTimer();
                    chime.play();
                }
                updateClockface(minutes);
            }, 50);
        }

        function stopTimer() {
            clearInterval(intervalId);
            intervalId = null;
        }

        function onClocktowerClick(event) {
            if(!chimePlayed) {
                chime.play();
                chime.pause();
                chimePlayed = true;
            }

            let boundedClickRect = clocktower.getBoundingClientRect();
            let x = ((event.clientX - boundedClickRect.left) * 2 / clocktower.clientWidth) - 1;
            let y = ((event.clientY - boundedClickRect.top) * 2 / clocktower.clientWidth) - 1;
            let radius = Math.sqrt(x*x + y*y);

            if(radius > 0.25 && radius < 0.5) {
                // Clicked in time:
                let radians = Math.atan2(-x, y) + Math.PI;
                clickClockface(radians);
            } else {
                // Clicked outside time: 
                if(intervalId === null) {
                    if(currentMinutes <= 60) {
                        startTimer();
                    }
                } else {
                    stopTimer();
                }
            }
            event.preventDefault();
        }

        function setPlayers(number) {
            if(number < 5) {
                number = 5;
            } else if(number > 15) {
                number = 15;
            }
            currentPlayers = number;
            let numbers = PLAYER_NUMBERS[number - 5];
            for(let i = 0; i < 4; i++) {
                let [count, label, text] = playerShadowData[i];
                let number = numbers[i];
                count.innerHTML = number;
                if(number !== 1 & i !== 0) {
                    text += 's';
                }
                label.innerHTML = text;

                [count, label, _text] = playerData[i];
                number = numbers[i];
                count.innerHTML = number;
                label.innerHTML = text;
            }
        }

        function onPlayersClick() {
            let number = currentPlayers + 1;
            if(number === 16) {
                number = 5;
            }
            setPlayers(number);
        }

        clocktower.addEventListener('click', onClocktowerClick);
        players.addEventListener('click', onPlayersClick);

        updateClockface(0);
        setPlayers(5);
 
    </script>
</body>
</html>
